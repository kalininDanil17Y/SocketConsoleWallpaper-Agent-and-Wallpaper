<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socket Console Wallpaper</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/crt.css">
  </head>
  <body class="theme-dark crt-enabled">
    <main id="wallpaper" class="wallpaper" aria-label="Socket Console Wallpaper">
      <canvas id="asciiCanvas"></canvas>
      <canvas id="uiCanvas"></canvas>
      <div class="crt-overlay" aria-hidden="true"></div>
      <div class="vhs-wave" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
